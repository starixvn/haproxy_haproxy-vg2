

########

backend pentagon_l2_dragon_tiger_fight_client_AWSPROD_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    http-request set-path %[path,lower,regsub(^/site-67[/]?,/)]
    server-template l2_dragon_tiger_fight_client_AWSPROD_ 2 l2_dragon_tiger_fight_client_AWSPROD:80 check resolvers docker init-addr none

