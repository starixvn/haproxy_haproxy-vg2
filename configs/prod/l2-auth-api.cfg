frontend l2_auth_api_PROD_fe
    bind *:8313
    mode  http
    option forwardfor
    default_backend l2_auth_api_PROD_be

backend l2_auth_api_PROD_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l2_auth_api_PROD_ 2 l2_auth_api_PROD:5000 check resolvers docker init-addr none
