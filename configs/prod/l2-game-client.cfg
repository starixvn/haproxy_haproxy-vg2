frontend l2_game_client_PROD_fe
    bind *:8110
    mode  http
    option forwardfor
    default_backend l2_game_client_PROD_be

backend l2_game_client_PROD_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l2_vg2_game_client_PROD_ 2 l2_vg2_game_client_PROD:80 check resolvers docker init-addr none

backend l2_game_client_mobi_PROD_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l2_game_client_mobi_PROD_ 1 l2_game_client_mobi_PROD:5000 check resolvers docker init-addr none

backend l2_treasure_island_client_PROD_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/game-client-47/,/)]
    server-template l2_vg2_treasure_island_client_PROD_ 1 l2_vg2_treasure_island_client_PROD:80 check resolvers docker init-addr none
