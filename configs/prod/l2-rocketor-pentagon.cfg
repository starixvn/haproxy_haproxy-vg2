

backend pentagon_l2_transformers_service_PROD_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    http-request set-path %[path,lower,regsub(^/transformers[/]?,/)]
    server-template l2_transformers_service_PROD_ 1 l2_transformers_service_PROD:5000 check resolvers docker init-addr none

