frontend l2_games_gateway
    bind *:8889
    mode  http
    option forwardfor

    use_backend %[path,map_beg(/etc/haproxy/maps/l2-game-proxy.map)] if { hdr(host) -i proxy.v-gaming.net:8889 }
    use_backend %[path,map_beg(/etc/haproxy/maps/l2-game-proxy.map)] if { hdr(host) -i proxy2.v-gaming.net:8889 }
    use_backend %[path,map_beg(/etc/haproxy/maps/l2-game-proxy.map)] if { hdr(host) -i proxy.v-gaming.net }
    use_backend %[path,map_beg(/etc/haproxy/maps/l2-game-proxy.map)] if { hdr(host) -i proxy2.v-gaming.net }

default_backend default_backend_nodes

backend l2_keno_power_service_PROD_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/kenopower/,/)]
    server-template l2_keno_power_service_PROD_ 1 l2_keno_power_service_PROD:5000 check resolvers docker init-addr none

