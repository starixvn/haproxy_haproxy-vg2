frontend l2_game_round_result_PROD_fe
    bind *:8315
    mode  http
    option forwardfor
    default_backend l2_game_round_result_PROD_be

backend l2_game_round_result_PROD_be
    option forwardfor
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    cookie serverid insert
    server-template l2_game_result_PROD_ 1 l2_game_result_PROD:5000 check resolvers docker init-addr none
