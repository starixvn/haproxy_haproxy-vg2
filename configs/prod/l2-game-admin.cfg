frontend l2_game_admin_site_PROD_fe
    bind *:8311
    mode  http
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    acl is_whitelisted_ip hdr_ip(x-forwarded-for,1) -f /etc/haproxy/whitelisted.ips
    acl is_whitelisted_ip src -m ip -f /etc/haproxy/whitelisted.ips
    http-request deny if !is_whitelisted_ip
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]
    default_backend l2_game_admin_site_PROD_be

backend l2_game_admin_site_PROD_be
    option forwardfor
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    cookie serverid insert
    server-template l2_admin_site_PROD_ 1 l2_admin_site_PROD:5000 check resolvers docker init-addr none

frontend l2_game_admin_api_PROD_fe
    bind *:8314
    mode  http
    option forwardfor
    default_backend l2_game_admin_api_PROD_be

backend l2_game_admin_api_PROD_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l2_admin_api_PROD_ 1 l2_admin_api_PROD:5000 check resolvers docker init-addr none
