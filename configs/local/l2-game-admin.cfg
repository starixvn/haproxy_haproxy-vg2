backend l2_vg2_admin_site_LOCAL_be
    option forwardfor
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    cookie serverid insert
    server-template l2_vg2_admin_site_LOCAL_ 1 l2_vg2_admin_site_LOCAL:5000 check resolvers docker init-addr none

