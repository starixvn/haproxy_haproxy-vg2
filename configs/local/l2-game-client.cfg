backend l2_game_client_LOCAL_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l2_vg2_game_client_LOCAL_ 2 l2_vg2_game_client_LOCAL:80 check resolvers docker init-addr none
    
