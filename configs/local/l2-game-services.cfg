
frontend l2_game_services_fe
    bind *:8889
    mode  http
    option forwardfor
    option http-keep-alive
    use_backend %[path,map_beg(/etc/haproxy/maps/l2-game-proxy.map)] if { hdr(host) -i l2-proxy.lumigame.com:8889 }
    use_backend %[path,map_beg(/etc/haproxy/maps/l2-game-proxy1.map)] if { hdr(host) -i l2-proxy1.lumigame.com:8889 }
    use_backend %[path,map_beg(/etc/haproxy/maps/l2-game-proxy.map)] if { hdr(host) -i l2-proxy.luminetsoft.com }
    use_backend %[path,map_beg(/etc/haproxy/maps/l2-game-proxy1.map)] if { hdr(host) -i l2-proxy1.luminetsoft.com }

default_backend default_backend_nodes

backend l2_game_server_LOCAL_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/main/,/)]
    server-template l2_game_server_LOCAL_ 1 l2_game_server_LOCAL:5000 check resolvers docker init-addr none

