backend pentagon_l2_fantan_client_AWSSIT_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    http-request set-path %[path,lower,regsub(^/sit/game-client-60[/]?,/)]
    server-template l2_fantan_client_AWSSIT_ 1 l2_fantan_client_AWSSIT:80 check resolvers docker init-addr none

