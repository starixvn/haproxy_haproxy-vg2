backend pentagon_l2_game_client_mobi_AWSSIT_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    server-template l2_game_client_mobi_AWSSIT_ 1 l2_game_client_mobi_AWSSIT:5000 check resolvers docker init-addr none

