
backend l2_instant_game_client_nodes_UAT
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l2_instant_game_client_UAT_ 1 l2_instant_game_client_UAT:80 check resolvers docker init-addr none

backend l2_instant_game_client_nodes_SIT
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l2_instant_game_client_SIT_ 1 l2_instant_game_client_SIT:80 check resolvers docker init-addr none
