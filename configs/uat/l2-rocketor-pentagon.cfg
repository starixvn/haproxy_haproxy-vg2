

backend pentagon_l2_fantan_service_UAT_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    server-template l2_fantan_service_UAT_ 1 l2_fantan_service_UAT:5000 check resolvers docker init-addr none

