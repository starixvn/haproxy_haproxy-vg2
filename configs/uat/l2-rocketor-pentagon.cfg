    cookie serverid insert
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    http-request set-path %[path,regsub(^/uat/site-106[/]?,/,i)]
    server-template l2_christmas_crash_client_UAT_ 1 l2_christmas_crash_client_UAT:80 check resolvers docker init-addr none

