
fontend l2_game_news_SIT_fe
    bind *:6316
    mode  http
    option forwardfor
    acl is-whitelisted-ip src -f /etc/haproxy/whitelisted.ips
    http-request deny if !is-whitelisted-ip
    default_backend l2_game_news_SIT_be

backend l2_game_news_SIT_be
    option forwardfor
    option http-server-close
    option httpchk HEAD /health
    http-check expect status 200
    cookie serverid insert
    server-template l2_game_news_SIT_ 2 l2_game_news_SIT:5000 check resolvers docker init-addr none

frontend l2_game_news_UAT_fe
    bind *:7316
    mode  http
    option forwardfor
    #acl is-whitelisted-ip src -f /etc/haproxy/whitelisted.ips
