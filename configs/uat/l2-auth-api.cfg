frontend l2_auth_api_SIT_fe
    bind *:6313
    mode  http
    option forwardfor
    #acl is-whitelisted-ip src -f /etc/haproxy/whitelisted.ips
    #http-request deny if !is-whitelisted-ip
    default_backend l2_auth_api_SIT_be

backend l2_auth_api_SIT_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l2_auth_api_SIT_ 1 l2_auth_api_SIT:5000 check resolvers docker init-addr none

